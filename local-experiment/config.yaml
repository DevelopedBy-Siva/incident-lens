# IncidentLens Local Experiment Configuration

# Model settings
model:
  base_model: "Qwen/Qwen2.5-3B-Instruct"
  # Alternative models:
  # base_model: "Qwen/Qwen2.5-7B-Instruct"
  # base_model: "meta-llama/Llama-3.2-3B-Instruct"

# LoRA configuration for QLoRA fine-tuning
lora:
  r: 16 # LoRA rank
  alpha: 32 # LoRA alpha (typically 2*r)
  dropout: 0.05 # LoRA dropout
  target_modules: # Modules to apply LoRA
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

# Training configuration
training:
  epochs: 3
  batch_size: 4
  gradient_accumulation_steps: 4 # Effective batch size = batch_size * gradient_accumulation_steps
  learning_rate: 2.0e-4
  max_seq_length: 2048
  warmup_steps: 100
  weight_decay: 0.01
  logging_steps: 10

# Generation configuration for inference
generation:
  max_new_tokens: 800 # Max tokens to generate
  temperature: 0.2 # Lower = more deterministic
  top_p: 0.9 # Nucleus sampling threshold

# Evaluation configuration
evaluation:
  min_temporal_overlap: 0.5 # Minimum overlap to match prediction with ground truth
