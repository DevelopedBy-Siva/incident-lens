# Local Experiment Configuration
# Production-compatible defaults from IncidentLens

# Base Model
base_model: "Qwen/Qwen2.5-3B-Instruct"

# LoRA Configuration (from production LoraTrainingProfile)
lora:
  rank: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

# Training Parameters
training:
  learning_rate: 0.0002
  num_epochs: 3
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8
  max_seq_length: 4096
  warmup_steps: 10
  logging_steps: 10
  save_steps: 100
  eval_steps: 100
  save_total_limit: 2
  load_best_model_at_end: true
  metric_for_best_model: "eval_loss"
  greater_is_better: false
  
# Data Split
data:
  train_split: 0.9
  eval_split: 0.1
  random_seed: 42

# Generation Settings (for inference)
generation:
  max_new_tokens: 512
  temperature: 0.1
  top_p: 0.95
  do_sample: true
  repetition_penalty: 1.1

# QLoRA Quantization
quantization:
  load_in_4bit: true
  bnb_4bit_compute_dtype: "float16"
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_use_double_quant: true

# Experiment Tracking
experiment:
  save_adapter: true
  save_metrics: true
  save_predictions: true
  save_error_analysis: true
