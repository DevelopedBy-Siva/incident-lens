services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-incidentlens}
      POSTGRES_USER: ${POSTGRES_USER:-incidentlens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-incidentlens}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - incidentlens-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-incidentlens} -d ${POSTGRES_DB:-incidentlens}
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  incidentlens-postgres-data:
