name: Deploy log analyzer to EC2

on:
  push:
    branches: [v1]
    paths:
      - "log-analyzer/**"
      - "compose.prod.yaml"
      - ".github/workflows/deploy-log-analyzer.yml"
  workflow_dispatch:

concurrency:
  group: log-analyzer-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: log-analyzer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: log-analyzer/requirements.txt
      - run: >-
          pip install torch==2.14.0+cpu
          --index-url https://download.pytorch.org/whl/cpu
          --extra-index-url https://pypi.org/simple
      - run: pip install -r requirements.txt
      - run: pip install pytest==8.3.5
      - run: python -m pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_PATH: ${{ secrets.EC2_DEPLOY_PATH }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      TRAINING_EC2_ENABLED: ${{ secrets.TRAINING_EC2_ENABLED }}
      TRAINING_EC2_AMI_ID: ${{ secrets.TRAINING_EC2_AMI_ID }}
      TRAINING_EC2_IAM_INSTANCE_PROFILE: ${{ secrets.TRAINING_EC2_IAM_INSTANCE_PROFILE }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/id_ec2
          chmod 600 ~/.ssh/id_ec2
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Build deployment bundle and environment
        run: |
          tar --exclude=.git --exclude='*/.venv*' --exclude='*/__pycache__' \
            -czf /tmp/incident-lens.tar.gz .
          umask 077
          {
            printf 'APP_ENV=prod\n'
            printf 'DATABASE_URL=%s\n' "$DATABASE_URL"
            printf 'SECRET_KEY=%s\n' "$SECRET_KEY"
            printf 'CORS_ORIGINS=%s\n' "$CORS_ORIGINS"
            printf 'AWS_REGION=%s\n' "${AWS_REGION:-us-east-1}"
            printf 'S3_BUCKET=%s\n' "$S3_BUCKET"
            printf 'S3_DATASET_PREFIX=datasets\n'
            printf 'S3_ARTIFACT_PREFIX=artifacts\n'
            printf 'DATASET_STORAGE_PATH=/app/data/datasets\n'
            printf 'ARTIFACT_STORAGE_PATH=/app/data/artifacts\n'
            printf 'MODEL_PROVIDER=local\n'
            printf 'BASE_MODEL=Qwen/Qwen3.5-4B\n'
            printf 'HF_TOKEN=%s\n' "$HF_TOKEN"
            printf 'DEVICE=cpu\n'
            printf 'DTYPE=auto\n'
            printf 'RESET_DATA_ON_STARTUP=false\n'
            printf 'POLL_INTERVAL=30\n'
            printf 'DATADOG_LOOKBACK_SECONDS=30\n'
            printf 'DD_LLMOBS_ENABLED=0\n'
            printf 'DD_LLMOBS_AGENTLESS_ENABLED=0\n'
            printf 'DD_TRACE_ENABLED=0\n'
            # EC2 GPU Training Configuration (deployment-specific)
            printf 'TRAINING_EC2_ENABLED=%s\n' "${TRAINING_EC2_ENABLED:-false}"
            printf 'TRAINING_EC2_AMI_ID=%s\n' "${TRAINING_EC2_AMI_ID:-}"
            printf 'TRAINING_EC2_IAM_INSTANCE_PROFILE=%s\n' "${TRAINING_EC2_IAM_INSTANCE_PROFILE:-}"
          } > /tmp/.env.production

      - name: Upload release
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          remote_path="${DEPLOY_PATH:-/home/$EC2_USER/incident-lens}"
          ssh -i ~/.ssh/id_ec2 "$EC2_USER@$EC2_HOST" \
            "mkdir -p '$remote_path/releases/${GITHUB_SHA}'"
          scp -i ~/.ssh/id_ec2 /tmp/incident-lens.tar.gz /tmp/.env.production \
            "$EC2_USER@$EC2_HOST:$remote_path/releases/${GITHUB_SHA}/"

      - name: Start release
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          remote_path="${DEPLOY_PATH:-/home/$EC2_USER/incident-lens}"
          ssh -i ~/.ssh/id_ec2 "$EC2_USER@$EC2_HOST" bash -s -- \
            "$remote_path" "$GITHUB_SHA" <<'REMOTE'
          set -euo pipefail
          deploy_path="$1"
          release="$deploy_path/releases/$2"
          cd "$release"
          tar -xzf incident-lens.tar.gz
          rm incident-lens.tar.gz
          docker compose -p incident-lens -f compose.prod.yaml up -d --build --remove-orphans
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8000/ready >/dev/null; then
              ln -sfn "$release" "$deploy_path/current"
              exit 0
            fi
            sleep 10
          done
          docker compose -p incident-lens -f compose.prod.yaml logs --tail=200
          exit 1
          REMOTE
