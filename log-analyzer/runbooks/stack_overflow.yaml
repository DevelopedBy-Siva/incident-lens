id: stack_overflow
name: Stack Overflow Error
description: Maximum call depth exceeded — likely circular reference or runaway recursion
default_severity: critical
disposition: ESCALATE
patterns:
  - "stackoverflowerror"
  - "maximum call depth exceeded"
  - "circular reference"
  - "stack overflow"
steps:
  - "Escalate to on-call before restarting an affected service that may be hung"
  - "Identify the recursive method from the stack trace"
  - "Check for circular object references in serialization"
  - "Add recursion depth guard or convert to iterative approach"
  - "Review recent changes to tree/graph traversal logic"
routing:
  team: backend
  notify: [pagerduty, slack]
observe_threshold:
  count: 1
  window_minutes: 5
  escalate_to: ESCALATE
cooldown_minutes: 5
