id: service_unavailable
name: Downstream Service Unavailable
description: Internal microservice returning 503 or circuit breaker opened
default_severity: high
disposition: NEEDS_ONCALL
patterns:
  - "serviceunavailableerror"
  - "returned 503"
  - "circuit breaker opened"
  - "after 3 retries"
  - "external service unavailable"
steps:
  - "Check health endpoint of the failing service"
  - "Review circuit breaker state and ask the service owner before any manual reset"
  - "Check if service is OOMing or crash-looping"
  - "Verify deployment — recent release may have introduced a bug"
  - "Check dependent services (DB, Redis) the failing service relies on"
routing:
  team: platform
  notify: [pagerduty, slack]
observe_threshold:
  count: 5
  window_minutes: 5
  escalate_to: ESCALATE
cooldown_minutes: 10
