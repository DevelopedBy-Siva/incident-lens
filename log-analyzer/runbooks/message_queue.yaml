id: message_queue
name: Message Queue Backlog Critical
description: Queue depth growing — consumer lag indicates processing bottleneck
default_severity: high
disposition: NEEDS_ONCALL
patterns:
  - "queuedepthcritical"
  - "pending messages"
  - "consumer lag growing"
  - "regex:queue.*full"
  - "message queue full"
steps:
  - "Check consumer process health — may be crashed or throttled"
  - "Ask on-call to verify consumer health before scaling consumers to drain the backlog"
  - "Review message processing time — may have become slower"
  - "Check for poison pill messages blocking the queue"
  - "Set a DLQ (dead letter queue) if not already configured"
routing:
  team: backend
  notify: [pagerduty, slack]
observe_threshold:
  count: 3
  window_minutes: 5
  escalate_to: ESCALATE
cooldown_minutes: 10
