id: disk_space
name: Disk Space Critical
description: Filesystem approaching capacity — write operations at risk
default_severity: critical
disposition: ESCALATE
patterns:
  - "diskspacecritical"
  - "% full"
  - "write operations may fail"
  - "disk space"
  - "no space left"
steps:
  - "Ask on-call to identify large or stale files and confirm they are safe before removal"
  - "Check for runaway log rotation or missing cleanup jobs"
  - "Expand volume or add additional storage if possible"
  - "Review data retention policies for /data and /var/lib/postgresql"
  - "Set up alerting at 80% to catch this earlier next time"
routing:
  team: infrastructure
  notify: [pagerduty, slack]
observe_threshold:
  count: 1
  window_minutes: 5
  escalate_to: ESCALATE
cooldown_minutes: 5
