id: db_connection_timeout
name: Database Connection Timeout
description: Database connection pool exhausted or network issues
default_severity: high
disposition: NEEDS_ONCALL
patterns:
  - "database connection timeout"
  - "databaseconnectionerror"
  - "connection timeout after"
  - "connection pool exhausted"
  - "connectionpoolexhaustederror"
  - "all connections in use"
  - "could not connect to database"
  - "db-primary"
  - "db-replica"
  - "db-analytics"
steps:
  - "Check database health metrics (CPU, memory, connections)"
  - "Verify network connectivity between app and database"
  - "Check connection pool configuration (max connections)"
  - "For pool exhaustion, look for connection leaks or long-running queries"
  - "Review recent deployments or schema changes"
  - "Escalate to the service owner before restarting any service for a suspected connection leak"
routing:
  team: platform
  notify: [email, slack]
observe_threshold:
  count: 10
  window_minutes: 5
  escalate_to: ESCALATE
cooldown_minutes: 15
