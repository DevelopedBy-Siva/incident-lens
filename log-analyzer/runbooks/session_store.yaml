id: session_store
name: Session Store Unavailable
description: Redis session store unreachable, app falling back to stateless mode
default_severity: high
disposition: NEEDS_ONCALL
patterns:
  - "sessionstoreerror"
  - "redis session store unreachable"
  - "falling back to stateless"
steps:
  - "Check Redis connectivity and memory usage"
  - "Verify stateless fallback is working correctly"
  - "Check if session data is being lost for active users"
  - "Escalate to the service owner before restarting Redis clients or connection pools"
  - "Review Redis eviction policy — maxmemory may be reached"
routing:
  team: infrastructure
  notify: [pagerduty, slack]
observe_threshold:
  count: 3
  window_minutes: 5
  escalate_to: ESCALATE
cooldown_minutes: 10
