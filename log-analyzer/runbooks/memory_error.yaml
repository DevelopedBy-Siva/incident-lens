id: memory_error
name: Out of Memory Error
description: JVM heap exhausted
default_severity: critical
disposition: ESCALATE

patterns:
  - "outofmemoryerror"
  - "java heap space"
  - "regex:heap.*max.*mb"

steps:
  - "Escalate to on-call before restarting affected service instances"
  - "Check heap dump if available"
  - "Review recent deployments for memory leaks"
  - "Analyze heap usage trends in monitoring"
  - "Consider increasing heap size if legitimate growth"
  - "Investigate for unclosed resources or caching issues"

routing:
  team: sre
  notify: [pagerduty, slack]

observe_threshold:
  count: 3
  window_minutes: 5
  escalate_to: ESCALATE

cooldown_minutes: 5
