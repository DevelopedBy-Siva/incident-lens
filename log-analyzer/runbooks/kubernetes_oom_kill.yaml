id: kubernetes_oom_kill
name: Kubernetes OOM Kill
description: Container killed by kernel for exceeding memory limit — pod restarting
default_severity: critical
disposition: ESCALATE
patterns:
  - "oomkilled"
  - "exceeded memory limit"
  - "killed by the kernel"
  - "api-server"
  - "worker-node"
  - "scheduler-pod"
steps:
  - "Identify the pod and check restart count: kubectl get pods --all-namespaces | grep -v Running"
  - "Get OOM details from pod events: kubectl describe pod <pod-name>"
  - "Check current memory limit vs actual usage — limit may be set too low"
  - "Review recent code changes for memory leaks — heap profiling if available"
  - "Ask the service owner to review memory limits before applying a temporary resource change"
  - "Check if this is a gradual memory leak (restarts growing over time) vs spike"
  - "Set up vertical pod autoscaler or increase resource request/limit permanently"
  - "Add memory usage alerts at 80% threshold to get ahead of future OOM kills"
routing:
  team: platform
  notify: [slack, email]
observe_threshold:
  count: 2
  window_minutes: 10
  escalate_to: ESCALATE
cooldown_minutes: 5
