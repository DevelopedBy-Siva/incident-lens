id: elasticsearch_shard_failure
name: Elasticsearch Shard Failure
description: Primary shard unavailable — search results degraded or unavailable
default_severity: high
disposition: NEEDS_ONCALL
patterns:
  - "shardfailureexception"
  - "primary shard"
  - "elasticsearch"
  - "search results degraded"
  - "unavailable"
steps:
  - "Check Elasticsearch cluster health — run GET /_cluster/health and look for red/yellow status"
  - "Identify affected index and shard: GET /_cat/shards?v&health=red"
  - "Check node availability — a failed node causes primary shard loss"
  - "If node is down, check disk space and system resources on that node"
  - "Escalate to the search/platform owner before attempting shard reallocation"
  - "Check index settings — replica count of 0 means no failover on primary loss"
  - "Review recent index operations for bulk writes that may have caused pressure"
routing:
  team: platform
  notify: [slack, email]
observe_threshold:
  count: 3
  window_minutes: 5
  escalate_to: ESCALATE
cooldown_minutes: 20
